[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "zyfeed"
version = "0.1.0"
description = "Strict blocklist conversion and scheduled publishing for Zyxel firewalls"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking :: Firewalls",
]
dependencies = []

[project.optional-dependencies]
dev = ["mypy>=1.14", "ruff>=0.9"]

[project.scripts]
zyfeed = "zyfeed.cli:main"

[tool.setuptools.packages.find]
include = ["zyfeed*"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"run" = ["UP036"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["zyfeed", "run"]
