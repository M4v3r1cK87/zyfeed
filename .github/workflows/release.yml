name: Release binaries

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            machine: x86_64
            runner: ubuntu-22.04
          - arch: arm64
            machine: aarch64
            runner: ubuntu-22.04-arm
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build and test dependencies
        run: python -m pip install '.[dev,build]'
      - name: Validate release version and native architecture
        env:
          EXPECTED_MACHINE: ${{ matrix.machine }}
        run: |
          python - <<'PY'
          import os
          import platform
          from zyfeed import __version__
          assert os.environ["GITHUB_REF_NAME"] == f"v{__version__}", "tag/version mismatch"
          assert platform.machine() == os.environ["EXPECTED_MACHINE"], "wrong build architecture"
          PY
      - name: Validate source
        run: |
          ruff format --check run zyfeed tests .github/smoke_binary.py
          ruff check run zyfeed tests .github/smoke_binary.py
          mypy
          python -B -m unittest discover -s tests -q
      - name: Build standalone executable
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --name zyfeed \
            --distpath "$RUNNER_TEMP/zyfeed-bin" \
            --workpath "$RUNNER_TEMP/zyfeed-build" \
            --specpath "$RUNNER_TEMP/zyfeed-spec" run
      - name: Test the actual binary without Python on PATH
        env:
          PYTHONPATH: tests
        run: |
          python -B .github/smoke_binary.py \
            "$RUNNER_TEMP/zyfeed-bin/zyfeed" "${GITHUB_REF_NAME#v}" \
            --https-source \
            "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_REF_NAME/examples/blocklist.adblock.txt"
      - name: Package executable, examples and license notices
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          name="zyfeed-$GITHUB_REF_NAME-linux-$ARCH"
          package="$RUNNER_TEMP/$name"
          mkdir -p "$package/examples" "$package/licenses" assets
          install -m 0755 "$RUNNER_TEMP/zyfeed-bin/zyfeed" "$package/zyfeed"
          cp README.md LICENSE "$package/"
          cp examples/blocklist.adblock.txt examples/zyfeed.example.toml \
            examples/overrides.example.txt "$package/examples/"
          python_version=$(python -c 'import platform; print(platform.python_version())')
          pyinstaller_version=$(python -c 'import PyInstaller; print(PyInstaller.__version__)')
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/python/cpython/v$python_version/LICENSE" \
            --output "$package/licenses/PYTHON.txt"
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/pyinstaller/pyinstaller/v$pyinstaller_version/COPYING.txt" \
            --output "$package/licenses/PYINSTALLER.txt"
          tar -C "$RUNNER_TEMP" -czf "assets/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: assets/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-*
          merge-multiple: true
          path: assets
      - name: Create checksums and verify both targets exist
        run: |
          test -s "assets/zyfeed-$GITHUB_REF_NAME-linux-amd64.tar.gz"
          test -s "assets/zyfeed-$GITHUB_REF_NAME-linux-arm64.tar.gz"
          (cd assets && sha256sum *.tar.gz > SHA256SUMS)
      - name: Upload a complete draft, then publish
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --draft --verify-tag --title "ZyFeed $GITHUB_REF_NAME" --generate-notes \
            assets/*.tar.gz assets/SHA256SUMS
          gh release view "$GITHUB_REF_NAME" --json assets,isDraft,tagName > release.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          release = json.loads(Path("release.json").read_text())
          tag = os.environ["GITHUB_REF_NAME"]
          expected = {
              f"zyfeed-{tag}-linux-amd64.tar.gz",
              f"zyfeed-{tag}-linux-arm64.tar.gz",
              "SHA256SUMS",
          }
          assert release["tagName"] == tag and release["isDraft"]
          assert {asset["name"] for asset in release["assets"]} == expected
          assert all(asset["size"] > 0 for asset in release["assets"])
          PY
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
